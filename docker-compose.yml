services:
  db:
    image: postgres:18
    container_name: taskwatch-db
    restart: unless-stopped
    ports:
      - "65432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: taskwatch
    volumes:
      - taskwatch_postgres_data:/var/lib/postgresql/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  taskwatch_postgres_data:
    name: taskwatch_postgres_data
